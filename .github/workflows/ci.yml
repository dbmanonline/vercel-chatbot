name: CI

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]
  workflow_dispatch:
    inputs:
      night_worker_commit:
        description: 'Night Worker commit SHA to test against (leave blank to use main HEAD)'
        required: false
        type: string

permissions:
  contents: read
  pull-requests: write

env:
  # These are never used in production. Only for local/CI testing.
  # Production uses Vercel AI Gateway with model keys configured in Vercel dashboard.
  E2E_BYPASS_AUTH: "1"
  MCP_ENABLED: "true"

jobs:
  # ============================================================
  # Unit tests + typecheck + lint + build
  # Runs on every push/PR. Never blocked by cross-repo secrets.
  # ============================================================
  unit-typecheck-build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: '10'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'pnpm'

      - name: Install
        run: pnpm install --frozen-lockfile

      - name: Lint (Biome)
        run: pnpm check

      - name: Typecheck
        run: pnpm exec tsc --noEmit -p tsconfig.json

      - name: Build
        run: pnpm build

  # ============================================================
  # Integration tests (requires Night Worker)
  # Conditionally clones + starts NW, then runs 36 tests.
  # Skips without NIGHT_WORKER_REPO_TOKEN (tests skip, not fail).
  # ============================================================
  integration-tests:
    runs-on: ubuntu-latest
    needs: unit-typecheck-build
    if: vars.NIGHT_WORKER_COMMIT != ''
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: '10'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'pnpm'

      - name: Install
        run: pnpm install --frozen-lockfile

      - name: Clone Night Worker
        uses: actions/checkout@v4
        with:
          repository: dbmanonline/night_worker
          ref: ${{ vars.NIGHT_WORKER_COMMIT }}
          token: ${{ secrets.NIGHT_WORKER_REPO_TOKEN }}
          path: night_worker
          fetch-depth: 1

      - name: Install Night Worker
        run: |
          cd night_worker && npm install --frozen-lockfile 2>/dev/null || npm install

      - name: Start Night Worker
        run: |
          cd night_worker && PORT=13579 MCP_ENABLED=true MCP_AUTH_TOKEN=ci-test-token-at-least-32-chars-long node server.js &
          for i in $(seq 1 20); do
            if curl -sf http://localhost:13579/health > /dev/null 2>&1; then
              echo "NW ready"
              break
            fi
            sleep 2
          done

      - name: Run tests with NW (36 tests)
        run: |
          echo "NIGHT_WORKER_URL=http://localhost:13579/mcp" >> $GITHUB_ENV
          echo "NIGHT_WORKER_TOKEN=ci-test-token-at-least-32-chars-long" >> $GITHUB_ENV
          pnpm exec tsx --test tests/with-timeout.test.ts tests/grounding.test.ts tests/mcp-client.test.ts tests/mcp-client-lifecycle.test.ts

  # ============================================================
  # E2E Night Worker
  #
  # RESOLVE NW SHA from (in priority order):
  #   1. workflow_dispatch input
  #   2. repo variable NIGHT_WORKER_COMMIT
  #   3. git ls-remote on origin/main
  # If SHA resolved but NW repo private + no token -> FAIL
  # If NW_URL missing -> SKIP
  # ============================================================
  e2e-night-worker:
    runs-on: ubuntu-latest
    needs: [unit-typecheck-build, integration-tests]
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: pnpm/action-setup@v4
        with:
          version: '10'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'pnpm'

      - name: Install chatbot deps
        run: pnpm install --frozen-lockfile

      # ----- Resolve Night Worker commit SHA -----
      - name: Resolve Night Worker commit SHA
        id: resolve_nw
        run: |
          echo "sha=unknown" >> "$GITHUB_OUTPUT"
          echo "SKIP_E2E=no" >> "$GITHUB_OUTPUT"
          echo "SKIP_REASON=" >> "$GITHUB_OUTPUT"

          REF=""
          # 1. workflow_dispatch input
          if [ -n "${{ github.event.inputs.night_worker_commit }}" ]; then
            REF="${{ github.event.inputs.night_worker_commit }}"
            echo "Using workflow_dispatch input: $REF"
          fi
          # 2. repo variable
          if [ -z "$REF" ] && [ -n "${{ vars.NIGHT_WORKER_COMMIT }}" ]; then
            REF="${{ vars.NIGHT_WORKER_COMMIT }}"
            echo "Using vars.NIGHT_WORKER_COMMIT: $REF"
          fi
          # 3. resolve main HEAD via ls-remote using github.token
          if [ -z "$REF" ]; then
            AUTH_URL="https://x-access-token:${GITHUB_TOKEN}@github.com/dbmanonline/night_worker"
            REF=$(git ls-remote "$AUTH_URL" main 2>/dev/null | cut -f1)
            echo "Resolved via ls-remote: ${REF:-none}"
          fi

          if [ -z "$REF" ]; then
            echo "sha=unknown" >> "$GITHUB_OUTPUT"
            echo "SKIP_E2E=NOT_RUN" >> "$GITHUB_OUTPUT"
            echo "SKIP_REASON=No NW token and no NIGHT_WORKER_COMMIT var — cannot resolve NW SHA" >> "$GITHUB_OUTPUT"
          else
            echo "sha=$REF" >> "$GITHUB_OUTPUT"
            echo "SKIP_E2E=no" >> "$GITHUB_OUTPUT"
          fi

      # ----- Checkout the resolved NW SHA -----
      - name: Checkout Night Worker at ${{ steps.resolve_nw.outputs.sha }}
        if: steps.resolve_nw.outputs.SKIP_E2E == 'no'
        uses: actions/checkout@v4
        with:
          repository: dbmanonline/night_worker
          ref: ${{ steps.resolve_nw.outputs.sha }}
          token: ${{ github.token }}
          path: night_worker
          fetch-depth: 0

      - name: Install Night Worker
        if: steps.resolve_nw.outputs.SKIP_E2E == 'no'
        run: |
          cd night_worker && pnpm install --frozen-lockfile 2>/dev/null || pnpm install

      - name: Start Night Worker
        if: steps.resolve_nw.outputs.SKIP_E2E == 'no'
        run: |
          cd night_worker && PORT=13579 MCP_ENABLED=true MCP_AUTH_TOKEN=ci-test-token-at-least-32-chars-long node server.js &
          sleep 5
          for i in $(seq 1 20); do
            if curl -sf http://localhost:13579/health > /dev/null 2>&1; then
              echo "NW server ready on port 13579"
              break
            fi
            sleep 2
          done

      - name: Report NOT_RUN status
        if: steps.resolve_nw.outputs.SKIP_E2E == 'NOT_RUN'
        run: |
          echo "::notice::E2E SKIPPED: ${{ steps.resolve_nw.outputs.SKIP_REASON }}"
          echo "To enable E2E: set NIGHT_WORKER_REPO_TOKEN secret or NIGHT_WORKER_COMMIT repo variable"

      # ----- Set MCP env for E2E -----
      - name: Configure E2E environment
        if: steps.resolve_nw.outputs.SKIP_E2E == 'no'
        run: |
          echo "NIGHT_WORKER_URL=http://localhost:13579/mcp" >> $GITHUB_ENV
          echo "NIGHT_WORKER_TOKEN=ci-test-token-at-least-32-chars-long" >> $GITHUB_ENV
          echo "E2E_PROXY_URL=http://localhost:20128" >> $GITHUB_ENV
          echo "E2E_PROXY_KEY=${{ secrets.AI_GATEWAY_API_KEY || '' }}" >> $GITHUB_ENV
          echo "E2E_BYPASS_AUTH=1" >> $GITHUB_ENV
          echo "MCP_ENABLED=true" >> $GITHUB_ENV

      - name: Run E2E real-model test
        if: steps.resolve_nw.outputs.SKIP_E2E == 'no'
        run: pnpm exec tsx tests/e2e-real-model-chat.test.ts
